<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Splash Screen -->
    <div id="splash">

        <h1 class="logo">NEXORA</h1>

        <p class="loading">Loading...</p>

    </div>

    <!-- Main Game -->
    <div id="game" style="display:none;">

        <header>

            <div class="coins">
                🪙 <span id="coins">0</span>
            </div>

            <div class="energy">
                ⚡ <span id="energy">500</span>/500
            </div>

        </header>

        <main>

            <div id="character">

                👤

            </div>

            <h2>Tap To Earn NXR</h2>

        </main>

        <nav>

            <button>🏠</button>
            <button>🎁</button>
            <button>🃏</button>
            <button>👥</button>
            <button>👤</button>

        </nav>

    </div>

    <script src="script.js"></script>

</body>

</html>
